    <rect width="1024" height="1024" fill="#fff"/>
    <path transform="translate(442 348.6) scale(5.83)" d="M12 2.6l2.85 5.95 6.55.9-4.78 4.55 1.2 6.5L12 17.35 6.18 20.5l1.2-6.5L2.6 9.45l6.55-.9z" fill="#000" stroke="#000" stroke-width="0.9" stroke-linejoin="round"/>
