<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
  <linearGradient id="hide" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b3729"/><stop offset="1" stop-color="#22170f"/></linearGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="11" result="g"/>
    <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.6  0 0 0 0 0.47  0 0 0 0 0.36  0 0 0 0.45 -0.18" result="gC"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="3" result="p"/>
    <feColorMatrix in="p" type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.03  0 0 0 0 0.02  0 0 0 0.7 -0.28" result="pC"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="pC"/><feMergeNode in="gC"/></feMerge>
