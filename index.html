  <script>
    /* If the app can't start (e.g. on a phone), show why instead of a blank page. */
    (function () {
      function show(msg, line) {
        var m = document.getElementById('main');
        if (!m || m.children.length) return;
        m.innerHTML = '<div style="padding:28px 20px;font:15px/1.5 -apple-system,Helvetica,Arial,sans-serif;color:#ff6961">The app hit a problem starting up. Please send a screenshot of this:<br><code style="display:block;margin-top:10px;white-space:pre-wrap;color:inherit">' + String(msg || 'unknown error').replace(/</g, '&lt;') + (line ? ' (line ' + line + ')' : '') + '</code></div>';
      }
      window.addEventListener('error', function (e) { show(e.message || (e.error && e.error.message), e.lineno); });
      window.addEventListener('unhandledrejection', function (e) { show('Promise: ' + (e.reason && (e.reason.message || e.reason))); });
      setTimeout(function () { show('The page loaded but the app never drew anything (no error reported).'); }, 6000);
    })();
  </script>
